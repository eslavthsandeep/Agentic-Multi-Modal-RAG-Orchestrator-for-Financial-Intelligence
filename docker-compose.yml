version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnibrain-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: ./backend
    container_name: omnibrain-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:///./data/stock.db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - qdrant
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: omnibrain-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_data:
